<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
    <style>
        .breadcrumbs {
            list-style: none;
            display: flex;
            gap: 0.2em;
            padding:0;

        .breadcrumbs li a{
            text-decoration: none;
        }
        .breadcrumbs li a:hover{

        }
        .breadcrumbs li:not(:last-child)::after {
            content: " /";
        }
    </style>
</head>
