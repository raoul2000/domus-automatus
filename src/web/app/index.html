<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="global.css" rel="stylesheet" />
    <title>Domus - Dashboard</title>
    <style>
      /* Centrage vertical et horizontal de la liste */
      body {
        margin: 0;
        padding: 30px; /* Maintenu pour le padding */
        height: 100vh;
      }
      .main {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      ul {
        list-style-type: none;
        padding-left: 0;
        display: flex;
        gap: 25px; /* Espacement augmenté entre les éléments */
        width: 100%;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
      }

      ul li {
        display: inline-block;
        border: 1px solid #2962ff; /* Bordure bleue sombre */
        border-radius: 0px;
        background-color: linear-gradient(
          135deg,
          #1e1e2f,
          #2d3436
        ); /* Gradient sombre */
        font-size: 19px;
        line-height: 1.3;
        cursor: pointer;
        transition: all 0.3s ease;
        width: 100%;
        text-align: center;
        box-shadow: 0 4px 10px rgba(0, 123, 255, 0.1); /* Ombre subtile */
        box-sizing: border-box;
      }

      ul li a {
        text-decoration: none;
        color: inherit;
        width: 100%;
        display: -webkit-box;
        padding:1em;
      }

      ul li:hover {
        background-color: linear-gradient(
          135deg,
          #2d3436,
          #3a4750
        ); /* Gradient hover sombre */
        color: #449eff; /* Texte bleu vif */
        box-shadow: 0 6px 15px rgba(0, 123, 255, 0.2);
      }

      /* Media query pour affichage vertical sur petits écrans */
      @media (max-width: 600px) {
        ul {
          flex-direction: column;
          align-items: stretch;
          padding: 0;
          gap: 5px;
        }

        ul li {
          margin-bottom: 25px; /* Espacement vertical augmenté */
          width: 100%; /* Ajusté pour s'adapter à la largeur */
          max-width: 100%; /* Empêche le dépassement */
        }
      }
    </style>
  </head>
  <body>
    <h1>Domus Automatus</h1>
    <div class="main">
      <ul>
        <li><a href="/app/explorer/index.php">📁&nbsp;Explorer</a></li>
        <li><a href="/app/log/index.php">🚩&nbsp;Logs</a></li>
      </ul>
    </div>
  </body>
</html>
